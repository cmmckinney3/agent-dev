<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Crucible app icon</title>
  <desc id="desc">A forge crucible holding molten code with connected agent sparks above it.</desc>
  <defs>
